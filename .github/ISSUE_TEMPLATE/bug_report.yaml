name: Bug Report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: motioncab-version
    attributes:
      label: MotionCab version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: spf-version
    attributes:
      label: SPF Framework version
      placeholder: e.g. 1.2.3
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Game & version
      placeholder: e.g. Euro Truck Simulator 2 1.61
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable X effect with settings Y
        2. Do this thing
        3. See the issue
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        Paste the full file from
        `plugins/spfPlugins/MotionCab/logs/MotionCab.log`.
      render: text
    validations:
      required: false
